<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크기의 사다리: 플랑크 길이에서 관측 가능한 우주까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..700&family=IBM+Plex+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070a18;
  --ink:#ece8f6;
  --ink-dim:#a29fbd;
  --micro:#ffa27a;
  --macro:#9cc8ff;
  --rule:rgba(236,232,246,.22);
  --scale-color:#f1ece4;
  --display:"Bricolage Grotesque", "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif;
  --body:"IBM Plex Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 우주 장면이라 라이트 모드에서도 어두운 무대를 유지하되, 토큰은 테마별로 정의 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --void:#070a18; --ink:#ece8f6; --ink-dim:#a29fbd; --rule:rgba(236,232,246,.22); }
}
:root[data-theme="dark"]{ --void:#070a18; --ink:#ece8f6; --ink-dim:#a29fbd; --rule:rgba(236,232,246,.22); }
:root[data-theme="light"]{ --void:#0c1024; --ink:#f3f0fa; --ink-dim:#b3b0cc; --rule:rgba(243,240,250,.26); }

*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; background:var(--void); color:var(--ink);
  font-family:var(--body); font-weight:400;
  -webkit-font-smoothing:antialiased;
}
#bg{ position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--void); }
#bg canvas{ position:absolute; left:0; top:0; display:none; will-change:transform,opacity; }
#bg .scrim{ position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(to top, rgba(4,5,12,.78), rgba(4,5,12,0) 50%), linear-gradient(to bottom, rgba(4,5,12,.55), rgba(4,5,12,0) 26%); }
#scene{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:1; }
#spacer{ height:calc(62 * 40vh); height:calc(62 * 40svh); }

.brand{
  position:fixed; z-index:2; top:0; left:0;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 28px 0;
  pointer-events:none;
}
.brand h1{
  margin:0; font-family:var(--display); font-weight:600; font-size:1.05rem;
  letter-spacing:-.01em;
}
.brand p{ margin:.2rem 0 0; font-size:.8rem; color:var(--ink-dim); }

.readout{
  position:fixed; z-index:2; left:0; bottom:0;
  padding:0 28px calc(env(safe-area-inset-bottom,0px) + 30px);
  max-width:min(34rem, 100%);
  pointer-events:none;
}
.power{
  font-family:var(--display); font-weight:250; line-height:.85;
  font-size:clamp(4.2rem, 12vw, 9.5rem); letter-spacing:-.045em;
  color:var(--scale-color);
  font-variation-settings:"opsz" 96;
  display:flex; align-items:flex-start;
}
.power sup{
  font-size:.42em; font-weight:400; letter-spacing:-.02em;
  margin-left:.04em; margin-top:.02em; min-width:3.2ch;
  font-variant-numeric:tabular-nums;
}
.power .unit{ font-size:.3em; font-weight:300; align-self:flex-end; margin:0 0 .12em .2em; color:var(--ink-dim); letter-spacing:0; }
.plain{ margin:.55rem 0 1.1rem; font-size:1rem; color:var(--ink-dim); font-variant-numeric:tabular-nums; }
.plain b{ color:var(--ink); font-weight:600; }
.what h2{ margin:0 0 .35rem; font-size:1.45rem; font-weight:600; letter-spacing:-.01em; }
.what p{ margin:0; font-size:.94rem; line-height:1.72; color:var(--ink-dim); max-width:32em; }
.what.in{ animation:swap .45s ease both; }
@keyframes swap{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.ruler{
  position:fixed; z-index:3; right:22px;
  top:calc(env(safe-area-inset-top,0px) + 11vh);
  bottom:calc(env(safe-area-inset-bottom,0px) + 11vh);
  width:14px;
}
.ruler::before{
  content:""; position:absolute; left:50%; top:0; bottom:0; width:1px;
  background:linear-gradient(var(--macro), var(--ink-dim) 45%, var(--micro));
  opacity:.55;
}
.ruler .end{
  position:absolute; right:22px; font-size:.72rem; color:var(--ink-dim); white-space:nowrap;
}
.ruler .end.top{ top:-1.7rem; right:-4px; }
.ruler .end.bottom{ bottom:-1.7rem; right:-4px; }
.tick{
  position:absolute; left:0; width:14px; height:14px; margin-top:-7px;
  padding:0; border:0; background:none; cursor:pointer; color:var(--ink);
}
.tick::before{
  content:""; position:absolute; left:3px; top:6px; width:8px; height:2px; border-radius:1px;
  background:var(--ink-dim); transition:width .2s, left .2s, background .2s;
}
.tick span{
  position:absolute; right:22px; top:50%; transform:translateY(-50%);
  font-family:var(--body); font-size:.78rem; white-space:nowrap;
  padding:.18rem .5rem; border-radius:3px;
  background:rgba(7,10,24,.72); color:var(--ink);
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.tick:hover span, .tick:focus-visible span, .tick.active span{ opacity:1; }
.tick:hover::before, .tick.active::before{ left:0; width:14px; background:var(--ink); }
.tick:focus-visible{ outline:2px solid var(--macro); outline-offset:2px; border-radius:2px; }
.now{
  position:absolute; left:-6px; width:26px; height:1px; background:var(--scale-color);
  box-shadow:0 0 8px var(--scale-color); pointer-events:none;
}

.hint{
  position:fixed; z-index:2; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
  transform:translateX(-50%);
  font-size:.85rem; color:var(--ink-dim); text-align:center; line-height:1.6;
  transition:opacity .6s; pointer-events:none;
}
.hint.gone{ opacity:0; }
.hint .wheel{
  display:block; width:18px; height:28px; margin:0 auto .5rem; border:1.5px solid var(--ink-dim); border-radius:10px; position:relative;
}
.hint .wheel::after{
  content:""; position:absolute; left:50%; top:14px; width:2px; height:6px; margin-left:-1px; background:var(--ink); border-radius:1px;
  animation:wheel 1.8s ease-in-out infinite;
}
@keyframes wheel{ 0%,100%{transform:translateY(0);opacity:1} 60%{transform:translateY(-8px);opacity:.2} }

.label{
  position:fixed; z-index:2; left:0; top:0; opacity:0; pointer-events:none;
  font-size:.8rem; color:var(--ink); text-align:center; white-space:nowrap; line-height:1.35;
  text-shadow:0 1px 6px rgba(0,0,0,.8);
}
.label small{ display:block; font-size:.72rem; color:var(--ink-dim); font-variant-numeric:tabular-nums; }
.compare{
  position:fixed; z-index:3; left:50%; top:calc(env(safe-area-inset-top,0px) + 76px);
  transform:translateX(-50%); width:min(34rem, 88vw); text-align:center;
  opacity:0; pointer-events:none; text-shadow:0 2px 14px rgba(0,0,0,.85);
}
.compare .pair{ font-size:.9rem; color:var(--ink-dim); font-variant-numeric:tabular-nums; }
.compare .pair b{ color:var(--ink); font-weight:600; }
.compare .big{
  font-family:var(--display); font-weight:300; font-size:clamp(2.6rem, 7vw, 4.6rem);
  line-height:1.05; letter-spacing:-.03em; color:var(--scale-color); margin:.15rem 0 .35rem;
}
.compare p{ margin:0 auto; font-size:1rem; line-height:1.65; max-width:28em; }
@media (min-width: 1100px){ .compare{ top:calc(env(safe-area-inset-top,0px) + 26px); } }
@media (max-width: 640px){ .compare p{ font-size:.9rem; } }
.fail{
  position:fixed; inset:0; z-index:5; display:none; place-items:center; padding:2rem; text-align:center;
  background:var(--void); color:var(--ink); line-height:1.7;
}

@media (min-width: 900px){
  .hint{ left:auto; right:80px; transform:none; text-align:right; }
  .hint .wheel{ margin:0 0 .5rem auto; }
}
@media (max-width: 640px){
  .brand{ padding-left:20px; padding-right:20px; }
  .readout{ padding-left:20px; padding-right:52px; }
  .what p{ font-size:.86rem; line-height:1.6; }
  .ruler{ right:14px; }
  .tick span{ display:none; }
  .hint{ display:none; }
}
@media (prefers-reduced-motion: reduce){
  .what.in{ animation:none; }
  .hint .wheel::after{ animation:none; }
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><div class="scrim"></div></div>
<canvas id="scene" aria-hidden="true"></canvas>

<header class="brand">
  <h1>크기의 사다리</h1>
  <p>스크롤 한 칸마다 세상이 10배씩 커지고 작아집니다</p>
</header>

<section class="readout">
  <div class="power" aria-label="현재 규모"><span>10</span><sup id="exp">0</sup><span class="unit">m</span></div>
  <div class="plain" id="plain">약 <b>1.7 m</b></div>
  <div class="what" id="what" aria-live="polite">
    <h2 id="name">사람</h2>
    <p id="desc"></p>
  </div>
</section>

<div class="compare" id="cmp" aria-live="polite">
  <div class="pair" id="cmpPair"></div>
  <div class="big" id="cmpBig"></div>
  <p id="cmpText"></p>
</div>

<nav class="ruler" id="ruler" aria-label="규모 눈금">
  <span class="end top">크게</span>
  <span class="end bottom">작게</span>
  <div class="now" id="now"></div>
</nav>

<div class="hint" id="hint"><span class="wheel"></span>위로 스크롤하면 우주로,<br>아래로 스크롤하면 원자 속으로</div>

<div id="spacer"></div>
<div class="fail" id="fail">이 브라우저에서 WebGL을 사용할 수 없어 3D 장면을 표시할 수 없습니다.<br>최신 Chrome, Safari, Edge에서 열어 주세요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE){ document.getElementById('fail').style.display='grid'; return; }

/* ---------- 유틸 ---------- */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }
var R = rng(20260929);
function gauss(){ var u=0; while(!u) u=R(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*R()); }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function smooth(x){ x=clamp(x,0,1); return x*x*(3-2*x); }
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function canvasTex(w,h,draw){
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var g=c.getContext('2d'); draw(g,w,h);
  var t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
var GLOW = canvasTex(128,128,function(g,w,h){
  var grd=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(.25,'rgba(255,255,255,.55)');
  grd.addColorStop(.6,'rgba(255,255,255,.12)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,w,h);
});
function glow(color,size,opacity){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:color,transparent:true,opacity:opacity==null?1:opacity,depthWrite:false,blending:THREE.AdditiveBlending}));
  s.scale.set(size,size,1); return s;
}
function makePoints(pos,col,size,opacity){
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  var useVC = Array.isArray(col);
  if(useVC) g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  var m=new THREE.PointsMaterial({size:size,map:GLOW,transparent:true,opacity:opacity==null?1:opacity,depthWrite:false,
    blending:THREE.AdditiveBlending,vertexColors:useVC,color:useVC?0xffffff:col,sizeAttenuation:true});
  var p=new THREE.Points(g,m); p.userData.baseSize=size; return p;
}
function std(color,o){ return new THREE.MeshStandardMaterial(Object.assign({color:color,roughness:.6,metalness:.05},o||{})); }
function cylBetween(a,b,r,mat){
  var d=new THREE.Vector3().subVectors(b,a), len=d.length();
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,8),mat);
  m.position.copy(a).addScaledVector(d,.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  return m;
}
function fibDirs(n){
  var out=[], ga=Math.PI*(3-Math.sqrt(5));
  for(var i=0;i<n;i++){ var y=1-(i+.5)/n*2, r=Math.sqrt(1-y*y), th=i*ga; out.push(new THREE.Vector3(Math.cos(th)*r,y,Math.sin(th)*r)); }
  return out;
}
function noise3(x,y,z){
  return Math.sin(x*5.1+1.3)*Math.sin(y*4.3+2.1)*Math.sin(z*3.7+.7)
       + .5*Math.sin(x*11.3+y*7.1+.4)*Math.sin(z*9.7+y*3.3)
       + .25*Math.sin(x*23.1+z*17.3)*Math.sin(y*21.7+1.9);
}
function displace(geo,fn){
  var p=geo.attributes.position, v=new THREE.Vector3();
  for(var i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); fn(v); p.setXYZ(i,v.x,v.y,v.z); }
  geo.computeVertexNormals(); return geo;
}

/* ---------- 3D 대상 만들기 (각 대상은 지름 약 1 단위로 정규화) ---------- */
var B = {};

B.planck = function(){
  var g=new THREE.Group(), geo=new THREE.SphereGeometry(1,20,14);
  var mat=std(0xb48cff,{emissive:0x4a1f96,roughness:.2,transparent:true,opacity:.35,depthWrite:false});
  var bubbles=[];
  for(var i=0;i<80;i++){
    var m=new THREE.Mesh(geo,mat), d;
    do{ d=new THREE.Vector3(R()*2-1,R()*2-1,R()*2-1); }while(d.length()>1);
    m.position.copy(d.multiplyScalar(.42));
    m.userData.s=.03+R()*.1; m.userData.ph=R()*6.28; m.userData.sp=1+R()*2.5;
    m.scale.setScalar(m.userData.s); g.add(m); bubbles.push(m);
  }
  g.add(glow(0x9c6bff,1.2,.35));
  g.userData.tick=function(t){ bubbles.forEach(function(b){ b.scale.setScalar(b.userData.s*(.55+.45*Math.sin(t*b.userData.sp+b.userData.ph))); }); g.rotation.y=t*.08; };
  return g;
};

B.quark = function(){
  var g=new THREE.Group();
  g.add(glow(0xff5f86,1.1,.8));
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.12,32,20),new THREE.MeshBasicMaterial({color:0xfff1f4})));
  var ring=new THREE.Mesh(new THREE.TorusGeometry(.32,.006,8,96),new THREE.MeshBasicMaterial({color:0xff9fb6,transparent:true,opacity:.7}));
  var ring2=ring.clone(); ring2.rotation.x=Math.PI/2.4;
  g.add(ring,ring2);
  g.userData.tick=function(t){ ring.rotation.set(t*.6,t*.4,0); ring2.rotation.set(Math.PI/2.4+t*.3,0,t*.5); };
  return g;
};

B.proton = function(){
  var g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.5,48,32),std(0xffd9a8,{transparent:true,opacity:.13,depthWrite:false,emissive:0x442200})));
  var cols=[0xff4d5e,0x3fe08a,0x4d8bff], q=[];
  for(var i=0;i<3;i++){
    var a=i/3*Math.PI*2, p=new THREE.Vector3(Math.cos(a)*.21,Math.sin(a)*.21,(i-1)*.05);
    var m=new THREE.Mesh(new THREE.SphereGeometry(.12,32,20),std(cols[i],{emissive:cols[i],emissiveIntensity:.45,roughness:.3}));
    m.position.copy(p); g.add(m); q.push(p);
  }
  var gm=std(0xffd54d,{emissive:0xffb300,emissiveIntensity:.8});
  for(var k=0;k<3;k++){
    var a0=q[k], b0=q[(k+1)%3], pts=[], dir=new THREE.Vector3().subVectors(b0,a0), n=new THREE.Vector3(0,0,1).cross(dir).normalize();
    for(var s=0;s<=24;s++){ var t=s/24; pts.push(a0.clone().lerp(b0,t).addScaledVector(n,Math.sin(t*Math.PI*6)*.035).setZ(a0.z+(b0.z-a0.z)*t+Math.cos(t*Math.PI*6)*.035)); }
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),80,.01,6),gm));
  }
  g.userData.tick=function(t){ g.rotation.set(Math.sin(t*.3)*.3,t*.35,t*.15); };
  return g;
};

B.nucleus = function(){
  var g=new THREE.Group(), geo=new THREE.SphereGeometry(.15,32,20);
  var pm=std(0xff6b5b,{roughness:.35}), nm=std(0x9aa6b8,{roughness:.35});
  var dirs=fibDirs(10);
  dirs.forEach(function(d,i){ var m=new THREE.Mesh(geo,i%2?pm:nm); m.position.copy(d).multiplyScalar(.24); g.add(m); });
  var a=new THREE.Mesh(geo,pm); a.position.set(.04,.05,.06); var b=new THREE.Mesh(geo,nm); b.position.set(-.05,-.04,-.05); g.add(a,b);
  g.userData.tick=function(t){ g.rotation.set(t*.2,t*.3,0); };
  return g;
};

B.atom = function(){
  var g=new THREE.Group(), pos=[], th=.094;
  for(var i=0;i<5000;i++){
    var r=-(Math.log(R()+1e-9)+Math.log(R()+1e-9)+Math.log(R()+1e-9))*th;
    var d=new THREE.Vector3(gauss(),gauss(),gauss()).normalize().multiplyScalar(r);
    pos.push(d.x,d.y,d.z);
  }
  var cloud=makePoints(pos,0x7fe3ff,.022,.75);
  g.add(cloud);
  g.add(glow(0xffa24d,.07,1));
  g.userData.tick=function(t){ cloud.rotation.y=t*.15; };
  return g;
};

B.dna = function(){
  var g=new THREE.Group(), N=26, H=2.0, pitch=1.7, rad=.42;
  var s1=[], s2=[], bb=std(0x9ec3ff,{roughness:.35,emissive:0x16305a});
  var baseCols=[[0x5aa9ff,0xffb35a],[0x6fe0a0,0xff7ba6]];
  for(var i=0;i<N;i++){
    var y=-H/2+i*H/(N-1), a=y/pitch*Math.PI*2;
    var p1=new THREE.Vector3(Math.cos(a)*rad,y,Math.sin(a)*rad);
    var p2=new THREE.Vector3(Math.cos(a+2.3)*rad,y,Math.sin(a+2.3)*rad);
    s1.push(p1); s2.push(p2);
    var pair=baseCols[Math.floor(R()*2)], flip=R()<.5, mid=p1.clone().lerp(p2,.5);
    g.add(cylBetween(p1,mid,.03,std(flip?pair[0]:pair[1],{roughness:.4})));
    g.add(cylBetween(mid,p2,.03,std(flip?pair[1]:pair[0],{roughness:.4})));
  }
  [s1,s2].forEach(function(s){ g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(s),200,.055,10),bb)); });
  g.rotation.z=.35;
  g.userData.tick=function(t){ g.rotation.y=t*.35; };
  return g;
};

B.virus = function(){
  var g=new THREE.Group();
  var core=new THREE.Mesh(displace(new THREE.IcosahedronGeometry(.33,3),function(v){ v.multiplyScalar(1+.04*noise3(v.x*3,v.y*3,v.z*3)); }),std(0x6aa88a,{roughness:.7}));
  g.add(core);
  var sg=new THREE.CylinderGeometry(.012,.018,.12,6), tg=new THREE.SphereGeometry(.035,12,8);
  var sm=std(0xd6e8a0,{roughness:.5}), tm=std(0xf2a65a,{roughness:.4,emissive:0x3a1a00});
  var up=new THREE.Vector3(0,1,0);
  fibDirs(60).forEach(function(d){
    var s=new THREE.Mesh(sg,sm); s.position.copy(d).multiplyScalar(.39); s.quaternion.setFromUnitVectors(up,d); g.add(s);
    var tip=new THREE.Mesh(tg,tm); tip.position.copy(d).multiplyScalar(.46); g.add(tip);
  });
  g.userData.tick=function(t){ g.rotation.set(t*.12,t*.25,0); };
  return g;
};

B.bacteria = function(){
  var g=new THREE.Group(), pts=[], rr=.19, half=.31, i;
  for(i=0;i<=14;i++){ var a=-Math.PI/2+i/14*Math.PI/2; pts.push(new THREE.Vector2(Math.max(0.0001,Math.cos(a)*rr),-half+Math.sin(a)*rr)); }
  for(i=0;i<=14;i++){ var b=i/14*Math.PI/2; pts.push(new THREE.Vector2(Math.max(0.0001,Math.cos(b)*rr),half+Math.sin(b)*rr)); }
  var body=new THREE.Mesh(new THREE.LatheGeometry(pts,48),std(0x9fd46a,{roughness:.45,emissive:0x1b2f08}));
  g.add(body);
  var fm=std(0xe4f2c8,{roughness:.6});
  for(var f=0;f<4;f++){

/* ---------- 스크롤 ↔ 규모 (위로 올리면 커지고, 내리면 작아짐) ---------- */
if('scrollRestoration' in history) history.scrollRestoration='manual';
function maxScroll(){ return Math.max(1,document.documentElement.scrollHeight-window.innerHeight); }
/* 대상 사이마다 스크롤 거리를 따로 배정: 너무 가까운 쌍도 비교할 시간을 주고, 텅 빈 구간은 압축 */
var SEG=[0];
for(var si=1;si<OBJECTS.length;si++) SEG.push(SEG[si-1]+clamp(OBJECTS[si].exp-OBJECTS[si-1].exp,.8,2.6));
var S_TOT=SEG[SEG.length-1];
document.getElementById('spacer').style.height=(S_TOT*42)+'vh';
function sOfE(e){
  if(e<=E_MIN) return 0;
  for(var i=1;i<OBJECTS.length;i++) if(e<=OBJECTS[i].exp) return SEG[i-1]+(e-OBJECTS[i-1].exp)/(OBJECTS[i].exp-OBJECTS[i-1].exp)*(SEG[i]-SEG[i-1]);
  return S_TOT;
}
function eOfS(s){
  s=clamp(s,0,S_TOT);
  for(var i=1;i<OBJECTS.length;i++) if(s<=SEG[i]) return OBJECTS[i-1].exp+(s-SEG[i-1])/(SEG[i]-SEG[i-1])*(OBJECTS[i].exp-OBJECTS[i-1].exp);
  return E_MAX;
}
function sFromScroll(){ return S_TOT*(1-window.scrollY/maxScroll()); }
function yForE(e){ return (1-sOfE(e)/S_TOT)*maxScroll(); }
function pOf(e){ return 1-sOfE(e)/S_TOT; }
window.scrollTo(0,yForE(START_E));

/* ---------- HUD ---------- */
var expEl=document.getElementById('exp'), plainEl=document.getElementById('plain'), whatEl=document.getElementById('what'),
    nameEl=document.getElementById('name'), descEl=document.getElementById('desc'), hint=document.getElementById('hint'),
    cmpEl=document.getElementById('cmp'), cmpPair=document.getElementById('cmpPair'), cmpBig=document.getElementById('cmpBig'), cmpText=document.getElementById('cmpText');
var lastExp=null, lastPlain=null, lastKey=null, lastAcc=null, lastPair=null, lastCmpA=-1;

function updateHUD(){
  var ex=Math.round(e);
  if(ex!==lastExp){ expEl.textContent=(ex<0?'−':'')+Math.abs(ex); lastExp=ex; }
  var pl=plainLength(Math.pow(10,e));
  if(pl!==lastPlain){ plainEl.innerHTML='약 <b>'+pl+'</b>'; lastPlain=pl; }

  var best=OBJECTS[0], bd=1e9;
  OBJECTS.forEach(function(o){ var d=Math.abs(o.exp-e); if(d<bd){ bd=d; best=o; } });
  if(best.id!==lastKey){
    nameEl.textContent=best.name; descEl.textContent=best.desc; lastKey=best.id;
    whatEl.classList.remove('in'); void whatEl.offsetWidth; whatEl.classList.add('in');
    OBJECTS.forEach(function(o){ o.tick.classList.toggle('active',o===best); });
  }

  /* 두 대상 사이를 지나는 동안 크기 비교 */
  var ca=0;
  for(var i=1;i<OBJECTS.length;i++){
    var A=OBJECTS[i-1], Bo=OBJECTS[i];
    if(e>=A.exp && e<=Bo.exp){
      var t=(e-A.exp)/(Bo.exp-A.exp);
      ca=smooth((t-.05)/.2)*smooth((.95-t)/.2);
      if(lastPair!==i){
        cmpPair.innerHTML='<b>'+A.name+'</b> '+plainLength(Math.pow(10,A.exp))+' → <b>'+Bo.name+'</b> '+plainLength(Math.pow(10,Bo.exp));
        cmpBig.textContent=Bo.big; cmpText.textContent=Bo.cmp; lastPair=i;
      }
      break;
    }
  }
  var cs=ca.toFixed(2); if(cs!==lastCmpA){ cmpEl.style.opacity=cs; lastCmpA=cs; }

  nowEl.style.top=(pOf(e)*100)+'%';
  var acc='#'+lerpKeys(ACC,e).getHexString();
  if(acc!==lastAcc){ document.documentElement.style.setProperty('--scale-color',acc); lastAcc=acc; }
}

var W=0,H=0,dist=3.2,look=new THREE.Vector3(),bgW=0,bgH=0;
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix();
  var asp=W/H; dist=3.2*Math.max(1,1.15/asp);
  look.set(asp>1.2?-.55:0, asp<.9?-.45:-.1, 0);
  bgW=Math.max(2.47*H,1.4*W); bgH=bgW/(CW/CH);
  CHAPTERS.forEach(function(c){ c.el.style.width=bgW+'px'; c.el.style.height=bgH+'px'; });
}
window.addEventListener('resize',resize); resize();

var mouse={x:0,y:0}, cam={x:0,y:0};
window.addEventListener('pointermove',function(ev){ mouse.x=ev.clientX/W*2-1; mouse.y=ev.clientY/H*2-1; });

var startY=window.scrollY;
window.addEventListener('scroll',function(){ if(Math.abs(window.scrollY-startY)>40) hint.classList.add('gone'); },{passive:true});

/* 카메라가 바라볼 높이: 현재 대상 높이의 절반 (대상은 모두 바닥선 y=0에 서 있음) */
function focusY(e){
  if(e<=OBJECTS[0].exp) return OBJECTS[0].Hm/2;
  for(var i=1;i<OBJECTS.length;i++){ var a=OBJECTS[i-1], b=OBJECTS[i]; if(e<=b.exp){ var t=(e-a.exp)/(b.exp-a.exp); return a.Hm/2*Math.pow(b.Hm/a.Hm,t); } }
  return OBJECTS[OBJECTS.length-1].Hm/2;
}

/* ---------- 루프 ---------- */
var last=performance.now(), t0=last, lp=new THREE.Vector3();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now; var t=(now-t0)/1000;
  var ts=sFromScroll();
  sCur+= (ts-sCur)*(1-Math.exp(-dt*(reduced?40:6)));
  if(Math.abs(ts-sCur)<1e-4) sCur=ts;
  e=eOfS(sCur);

  var X=camX(e), unit=Math.pow(10,e), fy=focusY(e)/unit;
  cam.x+=(mouse.x-cam.x)*.04; cam.y+=(mouse.y-cam.y)*.04;
  camera.position.set(look.x+cam.x*.25, fy+.3+look.y-cam.y*.18, dist);
  camera.lookAt(look.x, fy+look.y, 0);
  camera.updateMatrixWorld();
  var pxPerUnit=H/(2*dist*Math.tan(camera.fov*Math.PI/360));

  OBJECTS.forEach(function(o){
    var rel=o.exp-e, a=1;
    if(rel>1.3) a=1-(rel-1.3)/.6;
    if(rel<-2.3) a=1-(-2.3-rel)/.7;
    a=smooth(a);
    var g=o.group; g.visible=a>.004;
    if(!g.visible){ if(o.labelOn){ o.label.style.opacity=0; o.labelOn=false; } return; }
    var s=Math.pow(10,rel), cxw=(o.c-X)/unit;
    g.scale.setScalar(s); g.position.set(cxw-o.cx*s,-o.minY*s,0);
    o.mats.forEach(function(x){ x.m.opacity=x.base*a; if(x.pts) x.m.size=x.size*s; });
    if(g.userData.tick && !reduced) g.userData.tick(t);
    var hpx=Math.max(o.maxY-o.minY,o.w*.5)*s*pxPerUnit;
    if(hpx>16 && a>.3 && rel<.9){
      lp.set(cxw,0,0).project(camera);
      var sx=(lp.x+1)/2*W, sy=(1-lp.y)/2*H+10;
      if(sx>-100&&sx<W+100&&sy<H+40){
        o.label.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px) translateX(-50%)';
        o.label.style.opacity=(Math.min(1,(hpx-16)/24)*a).toFixed(2); o.labelOn=true;
      } else if(o.labelOn){ o.label.style.opacity=0; o.labelOn=false; }
    } else if(o.labelOn){ o.label.style.opacity=0; o.labelOn=false; }
  });

  /* 배경 장면 교차 전환 */
  lp.set(0,0,0).project(camera);
  var groundScreen=(1-lp.y)/2*H, dustMul=0;
  CHAPTERS.forEach(function(c){
    var a=smooth((e-c.from+.3)/.6)*smooth((c.to-e+.3)/.6);
    if(a<.003){ if(c.on){ c.el.style.display='none'; c.on=false; } return; }
    if(!c.on){ c.el.style.display='block'; c.on=true; }
    var gf=c.ground==null?.5:c.ground, gs=c.ground==null?H*.5:groundScreen;
    var s=clamp(Math.pow(10,-(e-c.anchor)*.22),.78,2.2);
    var left=W/2-bgW/2-cam.x*14, top=gs-gf*bgH-cam.y*8;
    c.el.style.transform='translate('+left.toFixed(1)+'px,'+top.toFixed(1)+'px) scale('+s.toFixed(4)+')';
    c.el.style.opacity=a.toFixed(3);
    dustMul+=a*c.dust;
  });

  var dc=lerpKeys(DUST,e);
  dust.forEach(function(p){
    var ph=(((e+p.userData.k*.5)%1)+1)%1, s=Math.pow(10,-ph);
    p.position.set(0,fy,0);
    p.scale.setScalar(s); p.material.size=.09*s; p.material.opacity=.45*Math.sin(Math.PI*ph)*Math.min(1,dustMul); p.material.color.copy(dc);
  });

  updateHUD();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
